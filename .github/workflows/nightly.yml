name: Nightly brief

on:
  # 04:30 Europe/Berlin. GitHub cron is UTC and has no time zones, so both
  # entries run; the "Check Berlin time" step skips the one that isn't 04:xx in Berlin
  # (CET in winter = UTC+1, CEST in summer = UTC+2).
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "live = real news + AI (needs the API key secrets); ingest = report only; dry = sample data"
        type: choice
        options: [live, ingest, dry]
        default: live

permissions:
  contents: write

concurrency:
  group: nightly-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    # Reading ~1,600 articles plus paced AI calls on free tiers can take a while.
    timeout-minutes: 75
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
    steps:
      - name: Check Berlin time
        id: gate
        run: |
          hour=$(TZ=Europe/Berlin date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "04" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: it is ${hour}:xx in Berlin, not 04:xx."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.gate.outputs.run == 'true'
        run: npm ci

      # Feed ETags and robots.txt answers survive between nights.
      - name: Restore the feed cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: .cache/http
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-

      # Real news → events → AI stories → web/public/data. If too few stories come out, the
      # previous brief is kept and this step fails (GitHub then emails you).
      - name: Build the brief
        if: steps.gate.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          case "$MODE" in
            live) npm run pipeline:live ;;
            ingest) npm run pipeline:ingest ;;
            dry) npm run pipeline:dry ;;
          esac

      - name: Save the run report
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: brief-report
          path: |
            pipeline/out/
            web/public/data/status.json
          retention-days: 7

      - name: Commit the new brief
        if: steps.gate.outputs.run == 'true' && env.MODE != 'ingest'
        run: |
          git config user.name "dawn-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Nightly brief $(TZ=Europe/Berlin date +%F)"
            git push
          fi
