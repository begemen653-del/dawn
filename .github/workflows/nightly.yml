name: Nightly brief

on:
  # Aimed at 04:30 Europe/Berlin. GitHub cron is UTC and often starts hours late; the extra
  # entries are backups, and the "Check Berlin time" step makes sure one brief is built a day.
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 3 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "live = real news + AI (needs the API key secrets); ingest = report only; dry = sample data"
        type: choice
        options: [live, ingest, dry]
        default: live

permissions:
  contents: write

concurrency:
  group: nightly-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    # Reading ~1,600 articles plus paced AI calls on free tiers can take a while.
    timeout-minutes: 95
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
    steps:
      # GitHub often starts scheduled jobs hours late, so instead of demanding 04:xx this runs
      # whenever it is past 04:00 in Berlin and today's brief isn't on main yet. Later triggers
      # on the same day then find the new brief and skip.
      - uses: actions/checkout@v7

      - name: Check Berlin time
        id: gate
        run: |
          hour=$(TZ=Europe/Berlin date +%-H)
          today=$(TZ=Europe/Berlin date +%F)
          git fetch -q origin main
          built=$(git show origin/main:web/public/data/status.json 2>/dev/null \
            | grep -o '"date": *"[0-9-]*"' | grep -o '[0-9-]\{10\}' || true)
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$hour" -lt 4 ] || [ "$built" = "$today" ]; }; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: Berlin time ${hour}:xx, brief on main is from ${built:-unknown}."
          else
            # A queued run may have started from an older commit; build on the newest one.
            # -B: stay on a real "main" branch (a bare "origin/main" checkout has no branch to push).
            git checkout -q -B main origin/main
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.gate.outputs.run == 'true'
        run: npm ci

      # Feed ETags and robots.txt answers survive between nights.
      - name: Restore the feed cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: |
            .cache/http
            .cache/images
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-

      # Real news → events → AI stories → web/public/data. If too few stories come out, the
      # previous brief is kept and this step fails (GitHub then emails you).
      - name: Build the brief
        if: steps.gate.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          case "$MODE" in
            live) npm run pipeline:live ;;
            ingest) npm run pipeline:ingest ;;
            dry) npm run pipeline:dry ;;
          esac

      - name: Save the run report
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: brief-report
          path: |
            pipeline/out/
            web/public/data/status.json
          retention-days: 7

      - name: Commit the new brief
        if: steps.gate.outputs.run == 'true' && env.MODE != 'ingest'
        run: |
          git config user.name "dawn-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Nightly brief $(TZ=Europe/Berlin date +%F)"
            # Someone may have pushed while the brief was being built: put the brief on top, then push.
            git pull -q --rebase origin main
            git push origin HEAD:main
          fi
