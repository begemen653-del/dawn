name: Nightly brief

on:
  # The punctual start comes from an outside timer (cron-job.org) that calls "Run workflow" at
  # 04:30 (kind: morning) and 18:00 (kind: evening) Berlin time; see docs/PIPELINE.md.
  # GitHub's own schedule is only a backup: it often starts runs many hours late. The
  # "Check Berlin time" step makes sure there is one morning brief a day.
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 3 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "morning = the full daily brief; evening = add the biggest new stories since the morning"
        type: choice
        options: [morning, evening]
        default: morning
      mode:
        description: "live = real news + AI (needs the API key secrets); ingest = report only; dry = sample data"
        type: choice
        options: [live, ingest, dry]
        default: live
      force:
        description: "Build the morning brief even if today's is already there"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    # Reading ~1,600 articles plus paced AI calls on free tiers can take a while.
    timeout-minutes: 95
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
      KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.kind || 'morning' }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    steps:
      # Morning: runs when it is past 04:00 in Berlin and today's brief isn't on main yet, so the
      # timer and GitHub's late backups never build two briefs a day.
      # Evening: runs only after 15:00 and only if today's brief is there to add to.
      - uses: actions/checkout@v7

      - name: Check Berlin time
        id: gate
        run: |
          hour=$(TZ=Europe/Berlin date +%-H)
          today=$(TZ=Europe/Berlin date +%F)
          git fetch -q origin main
          built=$(git show origin/main:web/public/data/status.json 2>/dev/null \
            | grep -o '"date": *"[0-9-]*"' | grep -o '[0-9-]\{10\}' || true)
          run=true
          if [ "$KIND" = "evening" ]; then
            if [ "$hour" -lt 15 ] || [ "$built" != "$today" ]; then run=false; fi
          elif [ "$FORCE" != "true" ] && { [ "$hour" -lt 4 ] || [ "$built" = "$today" ]; }; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = "false" ]; then
            echo "Skipping the $KIND run: Berlin time ${hour}:xx, brief on main is from ${built:-unknown}."
          else
            # A queued run may have started from an older commit; build on the newest one.
            # -B: stay on a real "main" branch (a bare "origin/main" checkout has no branch to push).
            git checkout -q -B main origin/main
          fi

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.gate.outputs.run == 'true'
        run: npm ci

      # Feed ETags and robots.txt answers survive between nights.
      - name: Restore the feed cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: |
            .cache/http
            .cache/images
          key: feeds-${{ github.run_id }}
          restore-keys: feeds-

      # Real news â†’ events â†’ AI stories â†’ web/public/data. If too few stories come out, the
      # previous brief is kept and this step fails (GitHub then emails you).
      - name: Build the brief
        if: steps.gate.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          case "$MODE" in
            live)
              if [ "$KIND" = "evening" ]; then
                # A small update: at most ~250k AI tokens and 30 minutes.
                DAWN_AI_TOKEN_BUDGET=250000 DAWN_TIME_LIMIT_MIN=30 npm run pipeline:evening
              else
                npm run pipeline:live
              fi ;;
            ingest) npm run pipeline:ingest ;;
            dry) npm run pipeline:dry ;;
          esac

      - name: Save the run report
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: brief-report
          path: |
            pipeline/out/
            web/public/data/status.json
          retention-days: 7

      - name: Commit the new brief
        if: steps.gate.outputs.run == 'true' && env.MODE != 'ingest'
        run: |
          git config user.name "dawn-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            if [ "$KIND" = "evening" ]; then
              git commit -m "Evening update $(TZ=Europe/Berlin date +%F)"
            else
              git commit -m "Nightly brief $(TZ=Europe/Berlin date +%F)"
            fi
            # Someone may have pushed while the brief was being built: put the brief on top, then push.
            git pull -q --rebase origin main
            git push origin HEAD:main
          fi
