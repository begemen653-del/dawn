name: Publish site

# Builds the app and publishes it on GitHub Pages: https://begemen653-del.github.io/dawn/
# Runs after every push to main and after each nightly brief (the nightly's own push can't
# start other workflows, so it is picked up here when the nightly finishes).
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Nightly brief]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Always the newest main, so a nightly run publishes the brief it just pushed.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          DAWN_BASE_PATH: /dawn
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
