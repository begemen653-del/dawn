<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dawn</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f141b;
        color: #c9d0d8;
        font-family: system-ui, sans-serif;
      }
      main {
        display: grid;
        place-items: center;
        height: 100%;
        padding: 24px;
        box-sizing: border-box;
      }
      div {
        max-width: 22rem;
      }
      h1 {
        font-family: Georgia, serif;
        font-weight: 500;
        font-size: 1.5rem;
        color: #e6e9ed;
        margin: 0 0 8px;
      }
      p {
        line-height: 1.5;
        margin: 0 0 20px;
        color: #8f99a5;
      }
      button {
        background: #e3b36a;
        color: #0f141b;
        border: 0;
        border-radius: 999px;
        padding: 10px 20px;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Dawn can't connect</h1>
        <p>
          Dawn needs a connection the first time it opens. After that, your latest brief stays available
          offline.
        </p>
        <button onclick="location.href = 'https://begemen653-del.github.io/dawn/'">Try again</button>
      </div>
    </main>
  </body>
</html>
